<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Right Guard · Project Dashboard</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    
    <style>
        :root {
            --crimson: #910023;
            --amber: #F4A823;
            --green: #1FA65A;
            --ink: #2B2226;
            --muted: #7A6E66;
            --bg-left: #f8f9fa;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        
        body {
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ⬅️ [왼쪽] 대시보드 영역: overflow를 없애고 딱 맞춤 */
        .left-panel {
            flex: 1.1;
            background: var(--bg-left);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 40px; /* 세로 패딩을 줄여 공간 확보 */
            height: 100%;
        }

        /* ➡️ [오른쪽] 고려대 본관 사진 영역 */
        .right-panel {
            flex: 0.9;
            background-image: url('Ku_Building.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            height: 100%;
        }

        .right-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, rgba(248, 249, 250, 0.1), rgba(145, 0, 35, 0.12));
        }

        .dashboard-content {
            width: 100%;
            max-width: 440px; /* 조금 더 슬림하게 축소 */
        }

        /* 헤더 영역 컴팩트하게 축소 */
        .header-area {
            text-align: center;
            margin-bottom: 24px; /* 마진 축소 */
        }

        .emblem-img {
            width: 75px; /* 엠블럼 크기 축소 (90px -> 75px) */
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 10px rgba(145, 0, 35, 0.1));
        }

        h1 {
            font-weight: 800;
            color: var(--ink);
            font-size: 28px; /* 글씨 크기 축소 (34px -> 28px) */
            letter-spacing: -0.02em;
            margin: 0 0 4px 0;
        }

        h1 span {
            color: var(--crimson);
        }

        .sub-tag {
            color: var(--crimson);
            font-weight: 700;
            letter-spacing: 0.05em;
            font-size: 11px; /* 글씨 크기 축소 (13px -> 11px) */
        }

        /* 버튼 간격을 좁혀 한눈에 들어오게 구성 */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px; /* 간격 축소 (14px -> 10px) */
            margin-bottom: 24px;
        }

        /* 🎴 버튼 크기 다이어트 (패딩 감소) */
        .card-btn {
            font: inherit;
            font-weight: 700;
            font-size: 14px; /* 폰트 크기 축소 (15px -> 14px) */
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 13px 20px; /* 패딩 대폭 축소하여 슬림화 */
            border-radius: 12px;
            background: #ffffff;
            color: var(--ink);
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 14px;
        }

        /* 이모지 박스도 콤팩트하게 변경 */
        .icon-wrap {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f3f5;
            transition: all 0.2s;
        }

        /* 🔴 마우스 오버 신호등 효과 (전체 컬러링 + 슬라이드) */
        .red-route:hover {
            background: var(--crimson);
            border-color: var(--crimson);
            color: #ffffff;
            transform: translateX(5px);
            box-shadow: 0 6px 15px rgba(145, 0, 35, 0.12);
        }
        .red-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 🟡 노란색 신호등 그룹 */
        .amber-route:hover {
            background: var(--amber);
            border-color: var(--amber);
            color: #ffffff;
            transform: translateX(5px);
            box-shadow: 0 6px 15px rgba(244, 168, 23, 0.12);
        }
        .amber-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 🟢 초록색 신호등 그룹 */
        .green-route:hover {
            background: var(--green);
            border-color: var(--green);
            color: #ffffff;
            transform: translateX(5px);
            box-shadow: 0 6px 15px rgba(31, 166, 90, 0.12);
        }
        .green-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        footer {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            letter-spacing: 0.02em;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 16px;
        }

        /* 📱 모바일/태블릿 반응형 */
        @media (max-width: 850px) {
            .right-panel { display: none; }
            .left-panel { flex: 1; padding: 20px; }
            body { overflow: auto; } /* 모바일 환경에서는 스크롤 허용 */
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="dashboard-content">
            
            <div class="header-area">
                <img src="emblem-koreauniv-transparent.png" alt="Right Guard Emblem" class="emblem-img">
                <h1>Right <span>Guard</span></h1>
                <div class="sub-tag">KOREA UNIVERSITY</div>
            </div>

            <div class="btn-container">
                <a href="Right_Guard_실행일정_체크리스트.html" class="card-btn red-route">
                    <span class="icon-wrap">📅</span>
                    <span>일정 체크리스트 열기</span>
                </a>
                
                <a href="Right_Guard_모형데모_설계가이드.html" class="card-btn red-route">
                    <span class="icon-wrap">📐</span>
                    <span>모형데모 설계가이드 열기</span>
                </a>
                
                <a href="Right_Guard_모형데모_작동애니메이션.html" class="card-btn red-route">
                    <span class="icon-wrap">🎬</span>
                    <span>작동 애니메이션 열기</span>
                </a>
                
                <a href="right_guard_controller.py" class="card-btn amber-route">
                    <span class="icon-wrap">🐍</span>
                    <span>Python 스크립트 다운로드</span>
                </a>
                
                <a href="Right_Guard_부품_BOM_예산.xlsx" class="card-btn green-route">
                    <span class="icon-wrap">📊</span>
                    <span>Excel 예산안 다운로드</span>
                </a>
            </div>

            <footer>
                CRP Team : Right Guard &copy; 2026
            </footer>
            
        </div>
    </div>

    <div class="right-panel"></div>

</body>
</html>
