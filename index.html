<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Right Guard · Project Dashboard</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    
    <style>
        :root {
            --crimson: #910023;
            --amber: #F4A823;
            --green: #1FA65A;
            --ink: #1e1e24;
            --muted: #554a4f;
            --glass-bg: rgba(255, 255, 255, 0.82); 
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        
        body {
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
            
            background-image: url('ku_image.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 🪟 [반투명 대시보드 판] 전체 구조 */
        .dashboard {
            width: 100%;
            max-width: 1150px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 24px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            
            display: flex;
            flex-direction: column; /* 1층과 2층을 위아래로 나누기 위해 column 사용 */
            gap: 18px;
        }

        /* ➡️ [1층] 로고와 버튼들이 완벽하게 한 줄로 나열되는 구역 */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            width: 100%;
        }

        /* 로고 및 타이틀 */
        .header-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .emblem-img {
            width: 48px;
            height: auto;
            filter: drop-shadow(0 3px 6px rgba(145, 0, 35, 0.12));
        }

        .title-text {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-weight: 800;
            color: var(--ink);
            font-size: 22px;
            letter-spacing: -0.01em;
            margin: 0;
            line-height: 1.1;
        }

        h1 span {
            color: var(--crimson);
        }

        .sub-tag {
            color: var(--crimson);
            font-weight: 700;
            letter-spacing: 0.05em;
            font-size: 10px;
            margin-top: 2px;
        }

        /* 버튼 컨테이너 (로고와 한 줄에 위치) */
        .btn-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            flex-grow: 1; /* 남은 가로 공간을 버튼들이 채움 */
            max-width: 800px; /* 버튼 구역이 과도하게 넓어지는 것 방지 */
        }

        /* 🎴 버튼 디자인 */
        .card-btn {
            font: inherit;
            font-weight: 700;
            font-size: 12.5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border-radius: 10px;
            background: #ffffff;
            color: var(--ink);
            border: 1px solid rgba(0, 0, 0, 0.03);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 6px;
            white-space: nowrap;
        }

        .icon-wrap {
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: #f1f3f5;
            transition: all 0.2s;
        }

        /* 🔴 마우스 오버 효과 */
        .red-route:hover {
            background: var(--crimson);
            border-color: var(--crimson);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(145, 0, 35, 0.2);
        }
        .red-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        .amber-route:hover {
            background: var(--amber);
            border-color: var(--amber);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(244, 168, 23, 0.2);
        }
        .amber-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        .green-route:hover {
            background: var(--green);
            border-color: var(--green);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(31, 166, 90, 0.2);
        }
        .green-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 💬 [2층] 한 줄 구조 아래에 넓게 깔리는 프로젝트 슬로건 구역 */
        .slogan-area {
            width: 100%;
            text-align: center;
            padding-top: 14px;
            border-top: 1px solid rgba(0, 0, 0, 0.06); /* 상단 한 줄 구역과 분리감을 주는 선 */
        }

        .slogan-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.4;
            color: #2b2b30;
        }

        .slogan-text .highlight {
            color: var(--crimson);
            font-weight: 800;
        }

        /* 📱 반응형 세팅: 화면이 좁아지면 모바일 레이아웃 최적화 */
        @media (max-width: 1100px) {
            .top-row { flex-direction: column; gap: 16px; }
            .header-area { text-align: center; }
            .btn-container { grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 100%; }
            body { overflow: auto; }
        }

        @media (max-width: 650px) {
            .btn-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="top-row">
            
            <div class="header-area">
                <img src="emblem-koreauniv-transparent.png" alt="Right Guard Emblem" class="emblem-img">
                <div class="title-text">
                    <h1>Right <span>Guard</span></h1>
                    <div class="sub-tag">KOREA UNIVERSITY</div>
                </div>
            </div>

            <div class="btn-container">
                <a href="Right_Guard_실행일정_체크리스트.html" target="_blank" rel="noopener noreferrer" class="card-btn red-route">
                    <span class="icon-wrap">📅</span>
                    <span>일정 체크리스트</span>
                </a>
                
                <a href="Right_Guard_모형데모_설계가이드.html" target="_blank" rel="noopener noreferrer" class="card-btn red-route">
                    <span class="icon-wrap">📐</span>
                    <span>모형데모 설계가이드</span>
                </a>
                
                <a href="Right_Guard_모형데모_작동애니메이션.html" target="_blank" rel="noopener noreferrer" class="card-btn red-route">
                    <span class="icon-wrap">🎬</span>
                    <span>작동 애니메이션</span>
                </a>
                
                <a href="right_guard_controller.py" target="_blank" rel="noopener noreferrer" class="card-btn amber-route">
                    <span class="icon-wrap">🐍</span>
                    <span>Python 스크립트</span>
                </a>
                
                <a href="Right_Guard_부품_BOM_예산.xlsx" target="_blank" rel="noopener noreferrer" class="card-btn green-route">
                    <span class="icon-wrap">📊</span>
                    <span>Excel 예산안</span>
                </a>
            </div>
            
        </div>
        
        <div class="slogan-area">
            <div class="slogan-text">
                <span class="highlight">Right Turn, Right Time:</span> 보행자 보호 중심의 교통안전 체계 제안
            </div>
        </div>
        
    </div>

</body>
</html>
