<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Right Guard · Files & Pages </title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    
    <style>
        /* 기존 페이지의 세련된 색상 조합을 그대로 가져왔습니다 */
        :root {
            --crimson: #910023;
            --ivory: #E7DECE;
            --red: #E23A2E;
            --amber: #F4A823;
            --green: #1FA65A;
            --paper: #F4EEE1;
            --card: #FFFFFF;
            --ink: #2B2226;
            --muted: #7A6E66;
            --faint: #A99C8E;
            --line: #E3D9C7;
            --r: 14px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }
        
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: var(--ink);
            background: var(--paper);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 중앙 메뉴 보드 레이아웃 */
        .menu-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(110, 0, 25, 0.06);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .wm h1 {
            font-weight: 800;
            color: var(--crimson);
            font-size: 32px;
            letter-spacing: .01em;
            margin: 0;
            line-height: 1;
        }

        .wm .tag {
            color: var(--crimson);
            font-weight: 700;
            letter-spacing: .15em;
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 8px;
            opacity: .85;
        }

        /* 기존 페이지의 시그니처 붉은 선 장식 */
        .rule {
            position: relative;
            height: 8px;
            margin: 20px 0 24px;
        }
        .rule .bar {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 6px;
            background: var(--crimson);
            border-radius: 2px;
        }
        .rule .core {
            position: absolute;
            left: 8px;
            right: 8px;
            top: 2.5px;
            height: 1px;
            background: var(--ivory);
        }
        .rule::before, .rule::after {
            content: "";
            position: absolute;
            top: -1px;
            height: 10px;
            width: 3px;
            background: var(--crimson);
        }
        .rule::before { left: 0; }
        .rule::after { right: 0; }

        .lead {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 24px;
        }

        /* 버튼 바구니 레이아웃 */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 공통 버튼 디자인 규칙 */
        .link-btn {
            font: inherit;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: block;
            padding: 14px;
            border-radius: 9px;
            cursor: pointer;
            transition: .15s;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .link-btn:active {
            transform: translateY(1px);
        }

        /* 파일 타입별 색상 디자인 매칭 */
        .html-btn {
            background: var(--crimson);
            color: #fff;
            border: 1px solid var(--crimson);
        }
        .html-btn:hover {
            background: #75001c;
            border-color: #75001c;
        }

        .py-btn {
            background: var(--amber);
            color: #fff;
            border: 1px solid var(--amber);
        }
        .py-btn:hover {
            background: #d99116;
            border-color: #d99116;
        }

        .xlsx-btn {
            background: var(--green);
            color: #fff;
            border: 1px solid var(--green);
        }
        .xlsx-btn:hover {
            background: #178548;
            border-color: #178548;
        }

        /* 하단 구분선과 푸터 */
        footer {
            margin-top: 24px;
            padding-top: 14px;
            border-top: 1px dashed var(--line);
            color: var(--faint);
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="menu-card">
        <div class="wm">
            <h1>Right Guard</h1>
            <div class="tag">Project Dashboard</div>
        </div>

        <div class="rule">
            <div class="bar"></div>
            <div class="core"></div>
        </div>

        <p class="lead">데모 페이지 및 관련 프로젝트 파일 모음입니다.</p>

        <div class="btn-container">
            <a href="Right_Guard_실행일정_체크리스트.html" class="link-btn html-btn">📅 일정 체크리스트 열기</a>
            
            <a href="Right_Guard_모형데모_설계가이드.html" class="link-btn html-btn">📐 모형데모 설계가이드 열기</a>
            
            <a href="Right_Guard_모형데모_작동애니메이션.html" class="link-btn html-btn">🎬 작동 애니메이션 열기</a>
            
            <a href="right_guard_controller.py" class="link-btn py-btn">🐍 Python 스크립트 다운로드</a>
            
            <a href="Right_Guard_부품_BOM_예산.xlsx" class="link-btn xlsx-btn">📊 Excel 예산안 다운로드</a>
        </div>
        <footer>
            Right Guard Repository &copy; 2026
        </footer>
    </div>

</body>
</html>
