<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Right Guard · Project Dashboard</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    
    <style>
        :root {
            --crimson: #910023;
            --amber: #F4A823;
            --green: #1FA65A;
            --ink: #1e1e24;
            --muted: #554a4f;
            /* 💡 중앙 카드를 위한 반투명 유리 배경 (뒷배경이 은은하게 투과됨) */
            --glass-bg: rgba(255, 255, 255, 0.75); 
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        
        /* 📸 [전체 배경] 새로운 ku_image.jpg 배경 적용 및 중앙 정렬 */
        body {
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            
            background-image: url('ku_image.webp'); /* 새로운 파일명 반영 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 🪟 [중앙 대시보드] 글래스모피즘 카드 디자인 */
        .dashboard {
            width: 100%;
            max-width: 460px; /* 한눈에 들어오는 안정적인 너비 */
            background: var(--glass-bg);
            backdrop-filter: blur(16px); /* 고급스러운 배경 블러 효과 */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.45); /* 유리 테두리 효과 */
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* 헤더 영역 축소하여 한 화면에 담기게 구성 */
        .header-area {
            margin-bottom: 24px;
        }

        .emblem-img {
            width: 75px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 10px rgba(145, 0, 35, 0.15));
        }

        h1 {
            font-weight: 800;
            color: var(--ink);
            font-size: 28px;
            letter-spacing: -0.02em;
            margin: 0 0 4px 0;
        }

        h1 span {
            color: var(--crimson);
        }

        .sub-tag {
            color: var(--crimson);
            font-weight: 700;
            letter-spacing: 0.05em;
            font-size: 11px;
        }

        /* 1열로 콤팩트하게 정렬되는 버튼 컨테이너 */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        /* 🎴 기본 버튼 스타일 (순백색으로 반투명 판 위에서 돋보임) */
        .card-btn {
            font: inherit;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 13px 20px;
            border-radius: 12px;
            background: #ffffff;
            color: var(--ink);
            border: 1px solid rgba(0, 0, 0, 0.03);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 14px;
        }

        .icon-wrap {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f3f5;
            transition: all 0.2s;
        }

        /* 🔴 마우스 올렸을 때 박스 전체가 신호등 컬러로 변하며 위로 살짝 뜨는 효과 */
        .red-route:hover {
            background: var(--crimson);
            border-color: var(--crimson);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(145, 0, 35, 0.2);
        }
        .red-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 🟡 노란색 신호등 그룹 */
        .amber-route:hover {
            background: var(--amber);
            border-color: var(--amber);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(244, 168, 23, 0.2);
        }
        .amber-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 🟢 초록색 신호등 그룹 */
        .green-route:hover {
            background: var(--green);
            border-color: var(--green);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(31, 166, 90, 0.2);
        }
        .green-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        footer {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.02em;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 16px;
        }

        /* 📱 모바일 디바이스 최적화 (모바일에서는 화면을 꽉 채우도록) */
        @media (max-width: 500px) {
            .dashboard { padding: 30px 20px; }
            body { overflow: auto; } /* 모바일 소형 폰 배려 */
        }
    </style>
</head>
<body>

    <!-- 🪟 정중앙에 위치하는 반투명 글래스모피즘 대시보드 -->
    <div class="dashboard">
        
        <div class="header-area">
            <img src="emblem-koreauniv-transparent.png" alt="Right Guard Emblem" class="emblem-img">
            <h1>Right <span>Guard</span></h1>
            <div class="sub-tag">KOREA UNIVERSITY</div>
        </div>

        <div class="btn-container">
            <!-- 🔴 빨간색 그룹 (체크리스트, 가이드, 애니메이션) -->
            <a href="Right_Guard_실행일정_체크리스트.html" class="card-btn red-route">
                <span class="icon-wrap">📅</span>
                <span>일정 체크리스트 열기</span>
            </a>
            
            <a href="Right_Guard_모형데모_설계가이드.html" class="card-btn red-route">
                <span class="icon-wrap">📐</span>
                <span>모형데모 설계가이드 열기</span>
            </a>
            
            <a href="Right_Guard_모형데모_작동애니메이션.html" class="card-btn red-route">
                <span class="icon-wrap">🎬</span>
                <span>작동 애니메이션 열기</span>
            </a>
            
            <!-- 🟡 노란색 그룹 (Python) -->
            <a href="right_guard_controller.py" class="card-btn amber-route">
                <span class="icon-wrap">🐍</span>
                <span>Python 스크립트 다운로드</span>
            </a>
            
            <!-- 🟢 초록색 그룹 (Excel) -->
            <a href="Right_Guard_부품_BOM_예산.xlsx" class="card-btn green-route">
                <span class="icon-wrap">📊</span>
                <span>Excel 예산안 다운로드</span>
            </a>
        </div>

        <footer>
            CRP Team : Right Guard &copy; 2026
        </footer>
        
    </div>

</body>
</html>
