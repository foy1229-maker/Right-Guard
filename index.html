<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Guard 프로젝트 모음</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }
        .link-btn {
            display: block;
            padding: 15px;
            text-align: center;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
        }
        /* 버튼 색상 디자인 */
        .html-btn { background-color: #4CAF50; } /* 초록색 (웹페이지) */
        .html-btn:hover { background-color: #45a049; }
        
        .py-btn { background-color: #008CBA; }   /* 파란색 (파이썬) */
        .py-btn:hover { background-color: #007bb5; }
        
        .xlsx-btn { background-color: #2e7d32; } /* 진한 초록색 (엑셀) */
        .xlsx-btn:hover { background-color: #1b5e20; }
    </style>
</head>
<body>

    <h1>🛡️ Right Guard</h1>
    <p>프로젝트 파일 및 페이지 모음</p>

    <div class="btn-container">
        <a href="Right_Guard_실행일정_체크리스트.html" class="link-btn html-btn">📄 첫 번째 웹페이지 열기</a>
        <a href="Right_Guard_모형데모_설계가이드.html" class="link-btn html-btn">📄 두 번째 웹페이지 열기</a>
        <a href="Right_Guard_모형데모_작동애니메이션.html" class="link-btn html-btn">📄 세 번째 웹페이지 열기</a>
        
        <a href="right_guard_controller.py" class="link-btn py-btn">🐍 Python 스크립트 다운로드</a>
        
        <a href="Right_Guard_부품_BOM_예산.xlsx" class="link-btn xlsx-btn">📊 Excel 데이터 다운로드</a>
    </div>

</body>
</html>
