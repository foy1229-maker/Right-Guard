<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Guard 프로젝트 모음</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }
        .link-btn {
            display: block;
            padding: 15px;
            text-align: center;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.2s;
        }
        .link-btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>🛡️ Right Guard Links</h1>

    <div class="btn-container">
        <a href="이름1.html" class="link-btn">첫 번째 페이지로 이동</a>
        <a href="이름2.html" class="link-btn">두 번째 페이지로 이동</a>
        <a href="이름3.html" class="link-btn">세 번째 페이지로 이동</a>
    </div>

</body>
</html>
