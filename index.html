<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Right Guard · Project Dashboard</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    
    <style>
        :root {
            --crimson: #910023;
            --amber: #F4A823;
            --green: #1FA65A;
            --ink: #2B2226;
            --muted: #62626a;
            --card-bg: rgba(255, 255, 255, 0.88); /* 반투명 유리 효과 카드 */
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        
        body {
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            
            /* 📸 배경 이미지 설정 영역 */
            background-image: url('고려대이미지.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* 이미지가 너무 밝아 글자가 안 보이는 것을 막아주는 어두운 반투명 막 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(43, 34, 38, 0.35); /* 이미지 위에 살짝 어두운 톤 추가 */
            backdrop-filter: blur(4px); /* 배경 이미지를 은은하게 블러 처리 */
            -webkit-backdrop-filter: blur(4px);
            z-index: 1;
        }

        /* 중앙 대시보드 컨테이너 (위로 얹어지도록 z-index 설정) */
        .dashboard {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .header-area {
            margin-bottom: 35px;
        }

        .emblem-img {
            width: 100px;
            height: auto;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 12px rgba(145, 0, 35, 0.15));
        }

        h1 {
            font-weight: 800;
            color: var(--ink);
            font-size: 36px;
            letter-spacing: -0.02em;
            margin: 0 0 6px 0;
        }

        h1 span {
            color: var(--crimson);
        }

        .sub-tag {
            color: var(--crimson);
            font-weight: 700;
            letter-spacing: 0.05em;
            font-size: 13px;
        }

        /* 대시보드 그리드 구조 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 35px;
        }

        .full-width {
            grid-column: span 2; 
        }

        /* 🎴 기본 버튼 공통 스타일 */
        .card-btn {
            font: inherit;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 18px 24px;
            border-radius: 14px;
            background: #ffffff;
            color: var(--ink);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 14px;
        }

        .icon-wrap {
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #f5f7fa;
            transition: all 0.25s;
        }

        /* 🔴 빨간색 라인 버튼 그룹 (체크리스트, 설계가이드, 애니메이션) */
        .red-route:hover {
            background: var(--crimson);
            border-color: var(--crimson);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(145, 0, 35, 0.25);
        }
        .red-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 🟡 노란색 라인 버튼 그룹 (Python) */
        .amber-route:hover {
            background: var(--amber);
            border-color: var(--amber);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(244, 168, 23, 0.25);
        }
        .amber-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 🟢 초록색 라인 버튼 그룹 (Excel) */
        .green-route:hover {
            background: var(--green);
            border-color: var(--green);
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(31, 166, 90, 0.25);
        }
        .green-route:hover .icon-wrap { background: rgba(255, 255, 255, 0.2); }

        /* 반응형 모바일 세팅 */
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .dashboard { padding: 35px 20px; }
            h1 { font-size: 28px; }
        }

        footer {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.02em;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header-area">
            <img src="emblem-koreauniv-transparent.png" alt="Right Guard Emblem" class="emblem-img">
            <h1>Right <span>Guard</span></h1>
            <div class="sub-tag">KOREA UNIVERSITY</div>
        </div>

        <div class="grid-container">
            
            <a href="Right_Guard_실행일정_체크리스트.html" class="card-btn red-route">
                <span class="icon-wrap">📅</span>
                <span>일정 체크리스트 열기</span>
            </a>
            
            <a href="Right_Guard_모형데모_설계가이드.html" class="card-btn red-route">
                <span class="icon-wrap">📐</span>
                <span>모형데모 설계가이드 열기</span>
            </a>
            
            <a href="Right_Guard_모형데모_작동애니메이션.html" class="card-btn red-route full-width">
                <span class="icon-wrap">🎬</span>
                <span>작동 애니메이션 열기</span>
            </a>
            
            <a href="right_guard_controller.py" class="card-btn amber-route full-width">
                <span class="icon-wrap">🐍</span>
                <span>Python 스크립트 다운로드</span>
            </a>
            
            <a href="Right_Guard_부품_BOM_예산.xlsx" class="card-btn green-route full-width">
                <span class="icon-wrap">📊</span>
                <span>Excel 예산안 다운로드</span>
            </a>
            
        </div>

        <footer>
            CRP Team : Right Guard &copy; 2026
        </footer>
    </div>

</body>
